apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitoring-alert-validator
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alert-validator
  template:
    metadata:
      labels:
        app: alert-validator
    spec:
      containers:
        - name: webhook-listener
          image: python:3.11-slim
          command: ["python3", "-c"]
          args:
            - |
              from http.server import BaseHTTPRequestHandler, HTTPServer
              import sys
              
              class L(BaseHTTPRequestHandler):
                  def do_POST(self):
                      content_len = int(self.headers['Content-Length'])
                      post_data = self.rfile.read(content_len).decode()
                      sys.stdout.write(post_data + '\n')
                      sys.stdout.flush()
                      self.send_response(200)
                      self.end_headers()
              
              HTTPServer(('0.0.0.0', 8089), L).serve_forever()
          ports:
            - containerPort: 8089
---
apiVersion: v1
kind: Service
metadata:
  name: monitoring-alert-routing-svc
  namespace: monitoring
spec:
  selector:
    app: alert-validator
  ports:
    - protocol: TCP
      port: 8089
      targetPort: 8089
